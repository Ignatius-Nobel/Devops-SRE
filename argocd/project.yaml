apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sre-assessment
  namespace: argocd
spec:
  description: Locked-down project for the leaky-app
  sourceRepos:
    - https://github.com/OWNER/REPO.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: leaky-app
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
