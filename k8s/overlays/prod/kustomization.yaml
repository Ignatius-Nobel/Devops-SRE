apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: memory-app
resources:
  - ../../base/namespace.yaml
  - ../../base/resource-quota.yaml
  - ../../base/config-and-secrets.yaml
  - ../../base/rbac.yaml
  - ../../base/network-policy.yaml
  - ../../base/app-service.yaml
  - ../../base/app-deployments.yaml
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: sre-assessment
images:
  - name: ignatiusnobel13/my-app
    newName: ignatiusnobel13/my-app
    newTag: "1.0.0"
