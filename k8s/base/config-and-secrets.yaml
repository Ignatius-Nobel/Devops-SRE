apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-app-config
  namespace: memory-app
data:
  APP_PORT: "8080"
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: memory-app-secret
  namespace: memory-app
type: Opaque
stringData:
  APP_ENV: "production"
  APP_TOKEN: "replace-me-with-real-secret"
