apiVersion: v1
kind: ServiceAccount
metadata:
  name: leaky-app
automountServiceAccountToken: false   # app never talks to the API server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leaky-app-config-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["leaky-app-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leaky-app-config-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leaky-app-config-reader
subjects:
  - kind: ServiceAccount
    name: leaky-app
    namespace: leaky-app
