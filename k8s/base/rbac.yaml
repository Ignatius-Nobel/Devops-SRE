apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-app-sa
  namespace: memory-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memory-app-role
  namespace: memory-app
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memory-app-rolebinding
  namespace: memory-app
subjects:
  - kind: ServiceAccount
    name: memory-app-sa
    namespace: memory-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memory-app-role
