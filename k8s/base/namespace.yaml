apiVersion: v1
kind: Namespace
metadata:
  name: leaky-app
  labels:
    app.kubernetes.io/part-of: sre-assessment
    # Pod Security Admission: reject anything not meeting the "restricted" profile
    pod-security.kubernetes.io/enforce: restricted
