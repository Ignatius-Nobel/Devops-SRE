apiVersion: v1
kind: ResourceQuota
metadata:
  name: leaky-app-quota
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 3Gi
    configmaps: "10"
    secrets: "10"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: leaky-app-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        memory: 400Mi   # nothing in this namespace may exceed the OOM limit
