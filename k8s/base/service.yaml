# One Service, selecting ALL three Deployments (shared label app=leaky-app).
# kube-proxy spreads connections evenly across the three endpoints.
apiVersion: v1
kind: Service
metadata:
  name: leaky-app
  labels:
    app: leaky-app
spec:
  type: ClusterIP
  selector:
    app: leaky-app
  ports:
    - name: http
      port: 80
      targetPort: http
