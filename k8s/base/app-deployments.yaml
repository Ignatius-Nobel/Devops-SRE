apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-app-v1
  namespace: memory-app
  labels:
    app: memory-app
    version: v1
    app.kubernetes.io/name: memory-app
    app.kubernetes.io/version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-app
      version: v1
  template:
    metadata:
      labels:
        app: memory-app
        version: v1
    spec:
      serviceAccountName: memory-app-sa
      initContainers:
        - name: init-config-check
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Preparing app runtime'; ls -l /etc/config || true"]
          volumeMounts:
            - name: app-config-volume
              mountPath: /etc/config
      containers:
        - name: memory-app
          image: ghcr.io/example/memory-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: memory-app-config
            - secretRef:
                name: memory-app-secret
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "400Mi"
          volumeMounts:
            - name: app-config-volume
              mountPath: /etc/config
      volumes:
        - name: app-config-volume
          configMap:
            name: memory-app-config
---
