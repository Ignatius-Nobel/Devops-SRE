apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memory-app-netpol
  namespace: memory-app
spec:
  podSelector:
    matchLabels:
      app: memory-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: memory-app
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: memory-app
      ports:
        - protocol: TCP
          port: 8080
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
