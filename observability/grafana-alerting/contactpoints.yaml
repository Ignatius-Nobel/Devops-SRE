apiVersion: 1
contactPoints:
  - orgId: 1
    name: slack-sre
    receivers:
      - uid: slack-sre-1
        type: slack
        settings:
          # Injected from the grafana-alert-secrets Secret (env var) - not stored in Git
          url: $SLACK_WEBHOOK_URL
          title: '{{ template "default.title" . }}'
          text: '{{ template "default.message" . }}'
        disableResolveMessage: false
