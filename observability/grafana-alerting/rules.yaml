apiVersion: 1
groups:
- orgId: 1
  name: leaky-app-reliability
  folder: SRE Alerts
  interval: 1m
  rules:
  - uid: app-pod-not-ready
    title: Application pod not ready
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum by (pod) (kube_pod_status_ready{namespace="leaky-app",condition="false"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    annotations:
      summary: Pod {{ $labels.pod }} is not Ready
      description: Pod {{ $labels.pod }} in leaky-app failed its readiness check or is down.
    labels:
      severity: critical
      team: sre
  - uid: app-deployment-unavailable
    title: Application deployment has unavailable replicas
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum by (deployment) (kube_deployment_status_replicas_unavailable{namespace="leaky-app"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    annotations:
      summary: Deployment {{ $labels.deployment }} has unavailable replicas
      description: Deployment {{ $labels.deployment }} reports unavailable replicas for over 1m.
    labels:
      severity: critical
      team: sre
  - uid: app-oomkilled
    title: Application container OOMKilled
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace="leaky-app"}[5m]) * on (namespace, pod, container) group_left kube_pod_container_status_last_terminated_reason{namespace="leaky-app",reason="OOMKilled"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    annotations:
      summary: Pod {{ $labels.pod }} was OOMKilled
      description: Container {{ $labels.container }} in pod {{ $labels.pod }} hit its 400Mi memory limit and was killed.
    labels:
      severity: critical
      team: sre
  - uid: app-memory-near-limit
    title: Application memory above 85% of limit
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (pod) (container_memory_working_set_bytes{namespace="leaky-app",container="app"} / on (pod, container) kube_pod_container_resource_limits{namespace="leaky-app",resource="memory",container="app"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.85
    annotations:
      summary: Pod {{ $labels.pod }} nearing memory limit
      description: Working set is above 85% of the limit - an OOMKill is imminent (leak).
    labels:
      severity: warning
      team: sre
