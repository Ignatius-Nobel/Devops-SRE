name: CI Pipeline
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flake8 pytest bandit trivy

      - name: Lint code
        run: |
          flake8 .

      - name: Run tests
        run: |
          pytest

      - name: Run SAST
        run: |
          bandit -r .

      - name: Scan for vulnerabilities
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL my-image:latest
