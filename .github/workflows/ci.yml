name: PR Pipeline
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  TRIVY_VERSION: "0.58.1"   # Docker Hub tag of aquasec/trivy; bump as needed

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install flake8==7.1.1
      - run: flake8 app tests

  test:
    name: Unit tests (pytest) py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit==1.7.10
      # B104 (0.0.0.0 binds) is skipped in bandit.yaml per assessment rules
      - run: bandit -r app -c bandit.yaml -ll

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  config-scan:
    name: Dockerfile & K8s manifest scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - name: Trivy misconfiguration scan (k8s manifests)
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:${TRIVY_VERSION} \
            config --severity HIGH,CRITICAL --exit-code 1 k8s

  build-scan:
    name: Build, smoke test & Trivy (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: PYTHON_VERSION=${{ matrix.python }}
          tags: leaky-app:pr-${{ matrix.python }}
          cache-from: type=gha,scope=py${{ matrix.python }}
          cache-to: type=gha,mode=max,scope=py${{ matrix.python }}
      - name: Smoke test container (non-root, serves /healthz)
        run: |
          docker run -d --name t -p 8080:8080 leaky-app:pr-${{ matrix.python }}
          for i in $(seq 1 15); do curl -fsS localhost:8080/healthz && break || sleep 1; done
          test "$(docker exec t id -u)" = "10001"
          docker rm -f t
      - name: Trivy image vulnerability scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:${TRIVY_VERSION} image --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 leaky-app:pr-${{ matrix.python }}

  # Single required status check for branch protection
  pr-gate:
    name: PR Gate
    if: always()
    needs: [lint, test, sast, secrets, config-scan, build-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any gate failed
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            exit 1
          fi
